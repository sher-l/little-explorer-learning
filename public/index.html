<!doctype html>
<html lang="zh-CN">
<head><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'none'"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>小小探险家 · 世界之心</title><link rel="stylesheet" href="style.css?v=20261105.12"><link rel="stylesheet" href="quiz-ui.css?v=20261105.12"><link rel="stylesheet" href="full-world.css?v=20261105.12"><link rel="stylesheet" href="reference-ui.css?v=20261105.12"><link rel="stylesheet" href="region-ui.css?v=20261105.12"></head>
<body>
<main id="game" aria-label="小小探险家，五域学习冒险">
  <canvas id="world" aria-label="探索地图，方向键或摇杆移动，也可以点击地面"></canvas>
  <header id="hud">
    <div class="place"><span id="place">世界之心</span><small id="task">五条小路，五种新的发现</small></div>
  </header>
  <div id="collectionTray">    <div id="bag" aria-label="本次收集进度"></div>
    <button id="lamp" class="icon-button" aria-label="提灯"><span class="asset lantern"></span><span id="lampGlow">✦</span><kbd>C</kbd></button>
</div>
  <button id="mazeZoom" class="wood-button" hidden aria-label="切换迷宫全图和近景">看近一点</button>
  <div id="notice" role="status" aria-live="polite"></div>
  <div id="worldActions"><button id="interact"><kbd>Enter</kbd><span id="actionText">看看周围</span></button></div>
  <footer>
    <div id="hint">方向键 / 摇杆走动 · 点地面也能走</div>
    <nav aria-label="游戏操作">
      <button id="voice" aria-label="再听一次"><span>♫</span><kbd>X</kbd></button>
      <button id="roll" aria-label="翻滚"><span>↻</span><kbd>Z</kbd></button>
      <button id="home" aria-label="沿原路返回"><span>↩</span><kbd>T</kbd></button>
      <button id="pause" aria-label="暂停"><span>Ⅱ</span><kbd>Esc</kbd></button>
    </nav>
  </footer>
  <section id="overlay" hidden aria-modal="true" role="dialog"><div id="panel"></div></section>
  <div id="loading">世界正在醒来…</div>
</main>
