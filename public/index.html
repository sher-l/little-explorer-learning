<body>
<main id="game" aria-label="小小探险家，五域学习冒险">
  <canvas id="world" aria-label="探索地图，方向键或摇杆移动，也可以点击地面"></canvas>
  <header id="hud">
    <div class="place"><span id="place">世界之心</span><small id="task">五条小路，五种新的发现</small></div>
  </header>
  <div id="collectionTray">    <div id="bag" aria-label="本次收集进度"></div>

  <footer>
    <div id="hint">方向键 / 摇杆走动 · 点地面也能走</div>
    <nav aria-label="游戏操作">
      <button id="voice" aria-label="再听一次"><span>♫</span><kbd>X</kbd></button>
      <button id="roll" aria-label="翻滚"><span>↻</span><kbd>Z</kbd></button>
      <button id="home" aria-label="沿原路返回"><span>↩</span><kbd>T</kbd></button>
      <button id="pause" aria-label="暂停"><span>Ⅱ</span><kbd>Esc</kbd></button>
    </nav>
  </footer>
